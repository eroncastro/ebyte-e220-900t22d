[project]
name = "ebyte-e220-900t22d"
version = "0.1.0"
description = "MicroPython driver for the EBYTE E220-900T22D LoRa module"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
